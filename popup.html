<!-- popup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WhoGhostedMe</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      width: 400px;
      min-height: 300px;
      overflow-y: auto;
      background-color: white;
      color: black;
    }
    h1 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 15px;
    }
    #status {
      font-size: 16px;
      margin-bottom: 15px;
      font-weight: bold;
      text-align: center;
    }
    #progressBar {
      height: 10px;
      background: #ccc;
      border-radius: 5px;
      margin-bottom: 15px;
      display: none;
    }
    #bar {
      height: 100%;
      width: 0%;
      background: black;
      transition: width 0.3s;
    }
    ul {
      padding-left: 0;
      list-style-type: none;
      margin-top: 10px;
    }
    li {
      margin-bottom: 5px;
    }
    li a {
      text-decoration: none;
      color: #0073e6;
    }
    li a:hover {
      text-decoration: underline;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      background-color: black;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 15px;
    }
    button:disabled {
      background-color: #ddd;
      cursor: not-allowed;
    }
    button.copied {
      background-color: #28a745;
      cursor: default;
    }
    /* SPINNER */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      display: inline-block;
      vertical-align: middle;
      margin-left: 5px;
      width: 12px;
      height: 12px;
      border: 2px solid #ccc;
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
  </style>
</head>
<body>
  <h1>WhoGhostedMe</h1>
  <div id="status"></div>
  <div id="progressBar"><div id="bar"></div></div>
  <ul id="results"></ul>
  <button id="copy" style="display:none;">Copy to Clipboard</button>
  <button id="open" style="display:none;">Open in New Page</button>
  <script src="popup.js"></script>
</body>
</html>
