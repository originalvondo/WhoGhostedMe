<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Non-Followers</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      width: 350px;
      max-height: 600px;
      overflow-y: auto;
      padding: 16px;
      background-color: #fafafa;
      color: #333;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 10px;
      text-align: center;
    }
    #status {
      margin-bottom: 10px;
      font-weight: bold;
    }
    ul {
      padding-left: 16px;
    }
    li {
      margin-bottom: 8px;
    }
    button {
      margin-top: 15px;
      padding: 10px;
      font-size: 14px;
      width: 100%;
      background-color: #3897f0;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>Who Ghosted You</h1>
  <div id="status">Checking profile...</div>
  <ol id="nonFollowersList"></ol>
  <button id="copyBtn" style="display:none;">Copy List to Clipboard</button>

  <script src="popup.js"></script>
</body>
</html>
