<!-- popup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WhoGhostedMe</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 18px;
      width: 390px;
      min-height: 280px;
      overflow-y: auto;
      background-color: #ffffff;
      color: #262626;
      margin: 0;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin: 0 0 12px 0;
      color: #262626;
      letter-spacing: -0.2px;
    }
    #status {
      font-size: 13px;
      margin-bottom: 12px;
      font-weight: 500;
      text-align: center;
      color: #737373;
    }
    #status strong {
      color: #262626;
      font-weight: 600;
    }
    .error-notice {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 12px;
      text-align: center;
      line-height: 1.4;
      font-weight: 500;
    }
    .progress-container {
      margin-bottom: 14px;
      display: none;
    }
    .progress-label {
      font-size: 12px;
      margin-bottom: 5px;
      font-weight: 500;
      color: #737373;
    }
    .progress-bar {
      height: 6px;
      background: #efefef;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #0095f6;
      transition: width 0.3s ease;
    }
    .progress-fill.followers { background: #0095f6; }
    .progress-fill.followings { background: #e1306c; }
    .progress-text {
      font-size: 11px;
      color: #8e8e8e;
      margin-top: 3px;
      text-align: right;
    }
    ol, ul {
      padding-left: 0;
      list-style-type: none;
      margin: 0 0 12px 0;
    }
    li {
      margin-bottom: 6px;
    }
    /* Instagram-style user cards */
    .user-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #fafafa;
      border: 1px solid #efefef;
      border-radius: 10px;
      transition: background 0.15s ease;
    }
    .user-card:hover {
      background: #f5f5f5;
    }
    .user-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: inherit;
      flex: 1;
      min-width: 0;
    }
    .profile-pic {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 12px;
      flex-shrink: 0;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background-color: #efefef;
    }
    .user-info {
      flex: 1;
      min-width: 0;
    }
    .username {
      font-weight: 600;
      font-size: 13px;
      color: #262626;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .user-card:hover .username {
      text-decoration: underline;
    }
    .full-name {
      font-size: 12px;
      color: #737373;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    /* Instagram-style Unfollow button */
    .unfollow-btn {
      width: auto;
      min-width: 80px;
      height: 32px;
      padding: 0 12px;
      margin-left: 10px;
      border: none;
      background-color: #efefef;
      color: #000000;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .unfollow-btn:hover:not(:disabled) {
      background-color: #fee2e2;
      color: #ed4956;
    }
    .unfollow-btn:disabled {
      cursor: default;
    }
    .unfollow-btn.unfollowed {
      background-color: #ffffff;
      color: #0095f6;
      border: 1px solid #dbdbdb;
    }
    .unfollow-btn.loading {
      background-color: #efefef;
      color: #737373;
      cursor: wait;
    }
    .unfollow-btn.error {
      background-color: #fef2f2;
      color: #ed4956;
      border: 1px solid #fecaca;
      cursor: pointer;
    }
    /* Main bottom button (Open in New Page) */
    button.main-btn {
      width: 100%;
      padding: 9px 16px;
      border: none;
      background-color: #0095f6;
      color: #ffffff;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      transition: background-color 0.15s ease;
    }
    button.main-btn:hover {
      background-color: #1877f2;
    }
    button.main-btn:disabled {
      background-color: #b2dffc;
      cursor: not-allowed;
    }
    /* Spinner */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      display: inline-block;
      vertical-align: middle;
      margin-left: 5px;
      width: 12px;
      height: 12px;
      border: 2px solid #dbdbdb;
      border-top-color: #737373;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    .empty-state {
      text-align: center;
      padding: 24px 10px;
      color: #737373;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>WhoGhostedMe</h1>
  <div id="status"></div>
  <div id="errorNotice" class="error-notice" style="display:none;"></div>
  
  <div id="progressContainer" class="progress-container">
    <div class="progress-label">Fetching followers... <span id="followersProgressText" class="progress-text">0 loaded</span></div>
    <div class="progress-bar"><div id="followersProgress" class="progress-fill followers"></div></div>
    
    <div class="progress-label" style="margin-top: 8px;">Fetching following... <span id="followingsProgressText" class="progress-text">0 loaded</span></div>
    <div class="progress-bar"><div id="followingsProgress" class="progress-fill followings"></div></div>
  </div>
  
  <ol id="results"></ol>
  <button id="open" class="main-btn" style="display:none;">Open in New Page</button>
  <script src="popup.js"></script>
</body>
</html>
