<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhoGhostedMe</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px 20px;
      max-width: 580px;
      margin: 0 auto;
      background-color: #fafafa;
      color: #262626;
      line-height: 1.5;
    }
    h2 {
      text-align: center;
      color: #262626;
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 18px 0;
      letter-spacing: -0.2px;
    }
    .error-notice {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 500;
    }
    .user-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      margin-bottom: 10px;
      background: #ffffff;
      border-radius: 10px;
      border: 1px solid #efefef;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: all 0.15s ease;
    }
    .user-card:hover {
      background: #fafafa;
      border-color: #dbdbdb;
    }
    .user-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: inherit;
      flex: 1;
      min-width: 0;
    }
    .user-link:hover {
      text-decoration: none;
    }
    .profile-pic {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 14px;
      flex-shrink: 0;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background-color: #efefef;
    }
    .user-info {
      flex: 1;
      min-width: 0;
    }
    .username {
      font-weight: 600;
      font-size: 14px;
      color: #262626;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .user-card:hover .username {
      text-decoration: underline;
    }
    .full-name {
      font-size: 13px;
      color: #737373;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .unfollow-btn {
      padding: 7px 16px;
      min-width: 88px;
      height: 32px;
      border: none;
      background-color: #efefef;
      color: #000000;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 12px;
      flex-shrink: 0;
    }
    .unfollow-btn:hover:not(:disabled) {
      background-color: #fee2e2;
      color: #ed4956;
    }
    .unfollow-btn:disabled {
      cursor: default;
    }
    .unfollow-btn.unfollowed {
      background-color: #ffffff;
      color: #0095f6;
      border: 1px solid #dbdbdb;
    }
    .unfollow-btn.loading {
      background-color: #efefef;
      color: #737373;
      cursor: wait;
    }
    .unfollow-btn.error {
      background-color: #fef2f2;
      color: #ed4956;
      border: 1px solid #fecaca;
      cursor: pointer;
    }
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: #737373;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2 id="pageTitle">People who don't follow back</h2>
  <div id="errorNotice" class="error-notice" style="display:none;"></div>
  <div id="user-list"></div>
  <script src="results.js"></script>
</body>
</html>
