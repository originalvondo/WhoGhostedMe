<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhoGhostedMe</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
      background-color: #fafafa;
      color: #333;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .user-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      margin-bottom: 12px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .user-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    .user-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: inherit;
      flex: 1;
      min-width: 0;
    }
    .user-link:hover {
      text-decoration: none;
    }
    .profile-pic {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 16px;
      flex-shrink: 0;
    }
    .user-info {
      flex: 1;
      min-width: 0;
    }
    .username {
      font-weight: 600;
      font-size: 16px;
      color: #0073e6;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .username:hover {
      text-decoration: underline;
    }
    .full-name {
      font-size: 14px;
      color: #666;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .unfollow-btn {
      padding: 8px 16px;
      min-width: 90px;
      height: 36px;
      border: none;
      background: black;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background-color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 12px;
      flex-shrink: 0;
    }
    .unfollow-btn:hover:not(:disabled) {
      background-color: #e11d48;
    }
    .unfollow-btn:disabled {
      cursor: not-allowed;
    }
    .unfollow-btn.unfollowed {
      background-color: #e6f4ea;
      color: #137333;
    }
    .unfollow-btn.loading {
      background-color: #555;
      cursor: wait;
    }
    .unfollow-btn.error {
      background-color: #fce8e6;
      color: #c5221f;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }
  </style>
</head>
<body>
  <h2 id="pageTitle">People who ghosted</h2>
  <div id="user-list"></div>
  <script src="results.js"></script>
</body>
</html>
